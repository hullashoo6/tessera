name: CI

on:
  push:
    branches: [main]
    # Text-only changes do not need a build (saves the account's Actions minutes;
    # macOS minutes count ten times). The website job still runs for website/.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bench-results/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest: Windows Server x64; macos-latest: Apple Silicon.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Interface (install, type-check, lint, build)
        working-directory: apps/desktop
        run: |
          npm ci
          npx oxlint src
          npm test
          npm run build
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Real Trash round trip and Put back (macOS)
        if: runner.os == 'macOS'
        run: cargo test -p tessera-cleanup --locked -- --ignored put_back
      - name: Smoke-test CLI on a generated fixture
        shell: bash
        run: |
          cargo run --release --locked -p tessera-cli -- gen "$RUNNER_TEMP/fx" --files 20000
          cargo run --release --locked -p tessera-cli -- bench "$RUNNER_TEMP/fx" --runs 3
      - name: Long-session memory gate (fails if memory accumulates across scans)
        shell: bash
        run: cargo run --release --locked -p tessera-cli -- soak "$RUNNER_TEMP/fx" --runs 10 --max-peak-growth-mib 8
      - name: Screen request time budgets (fails if any request is over budget)
        shell: bash
        run: cargo run --release --locked -p tessera-cli -- ui-bench "$RUNNER_TEMP/fx" --check

  website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install and build
        working-directory: website
        run: |
          npm ci
          npm run build
