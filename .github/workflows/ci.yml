name: CI

on:
  push:
    branches: [main]
    # Text-only changes do not need a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bench-results/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest: Windows Server x64; macos-latest: Apple Silicon.
        # The repository is public (27 Nov 2026), so both run on every change.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Interface (install, type-check, lint, build)
        working-directory: apps/desktop
        run: |
          npm ci
          npx oxlint src
          npm test
          npm run build
      - name: Interface is a production build
        shell: bash
        working-directory: apps/desktop
        run: |
          if grep -l -e jsxDEV -e react-stack-bottom-frame dist/assets/*.js; then
            echo "React's development build was bundled"; exit 1
          fi
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Real Recycle Bin / Trash with disposable files (cleanup, Put back, permanent delete)
        run: cargo test -p tessera-cleanup --locked --test cleanup -- --ignored put_back real_recycle_bin real_cleanup_run too_big
      - name: Smoke-test CLI on a generated fixture
        shell: bash
        run: |
          cargo run --release --locked -p tessera-cli -- gen "$RUNNER_TEMP/fx" --files 20000
          cargo run --release --locked -p tessera-cli -- bench "$RUNNER_TEMP/fx" --runs 3
      - name: Long-session memory gate (fails if memory accumulates across scans)
        shell: bash
        run: cargo run --release --locked -p tessera-cli -- soak "$RUNNER_TEMP/fx" --runs 10 --max-peak-growth-mib 8
      - name: Screen request time budgets (fails if any request is over budget)
        shell: bash
        run: cargo run --release --locked -p tessera-cli -- ui-bench "$RUNNER_TEMP/fx" --check

  website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install and build
        working-directory: website
        run: |
          npm ci
          npm run build
