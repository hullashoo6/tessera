name: Release build

# Manual only. Builds installers as private workflow artifacts in this
# private repository. Nothing is published, uploaded elsewhere or signed
# with a paid certificate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Installer (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            bundles: nsis
            dir: nsis
          - os: macos-latest
            label: macOS Apple silicon
            bundles: dmg
            dir: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install interface dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build installer
        working-directory: apps/desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Checksums
        shell: bash
        working-directory: target/release/bundle/${{ matrix.dir }}
        run: |
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS.txt; else shasum -a 256 * > SHA256SUMS.txt; fi
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ matrix.dir }}-${{ github.sha }}
          path: target/release/bundle/${{ matrix.dir }}/*
          retention-days: 14
