name: Release build

# Manual only. Builds installers as private workflow artifacts in this
# private repository. Nothing is published, uploaded elsewhere or signed
# with a paid certificate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Installer (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            args: --bundles nsis
            out: target/release/bundle/nsis
          - os: macos-latest
            label: macOS universal (Apple silicon + Intel)
            args: --target universal-apple-darwin --bundles dmg
            out: target/universal-apple-darwin/release/bundle/dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add both Mac architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install interface dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build installer
        working-directory: apps/desktop
        run: npx tauri build ${{ matrix.args }}
      - name: Checksums
        shell: bash
        working-directory: ${{ matrix.out }}
        run: |
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS.txt; else shasum -a 256 * > SHA256SUMS.txt; fi
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: tessera-${{ runner.os }}-${{ github.sha }}
          path: ${{ matrix.out }}/*
          retention-days: 14
