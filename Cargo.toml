[workspace]
resolver = "3"
members = [
    "crates/scan",
    "crates/treemap",
    "crates/cleanup",
    "crates/licensing",
    "crates/insights",
    "crates/dupes",
    "crates/apps",
    "crates/testkit",
    "crates/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-Proprietary"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"

# Benchmarks use the release profile; tests stay fast to compile.
[profile.test]
opt-level = 1

# Keep development builds small on disk: minimal debug info for our code,
# none for third-party crates. (Full debug info filled 30 GB here.)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
