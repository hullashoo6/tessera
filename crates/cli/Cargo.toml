[package]
name = "tessera-cli"
description = "Command-line scanner, fixture generator and benchmark runner for Tessera."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tessera-cli"
path = "src/main.rs"

[dependencies]
tessera-insights = { path = "../insights" }
tessera-scan = { path = "../scan" }
tessera-testkit = { path = "../testkit" }
tessera-treemap = { path = "../treemap" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
