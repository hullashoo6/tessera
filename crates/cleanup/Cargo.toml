[package]
name = "tessera-cleanup"
description = "Review-first cleanup: protection rules, planning, revalidation and Recycle Bin / Trash moves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tessera-scan = { path = "../scan" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.62"
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSPathUtilities"] }
libc = "0.2"

[dev-dependencies]
tessera-testkit = { path = "../testkit" }
