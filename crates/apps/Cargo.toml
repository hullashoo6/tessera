[package]
name = "tessera-apps"
description = "Installed apps and their own uninstallers (Windows)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Com", "Foundation", "Foundation_Collections", "ApplicationModel", "Management_Deployment", "Storage"] }
windows-core = "0.62"
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
tessera-cleanup = { path = "../cleanup" }

[dev-dependencies]
tessera-testkit = { path = "../testkit" }
