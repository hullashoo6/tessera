[package]
name = "tessera-desktop"
description = "Tessera desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tessera_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tessera-apps = { version = "0.1.0", path = "../../../crates/apps" }
tessera-cleanup = { version = "0.1.0", path = "../../../crates/cleanup" }
tessera-dupes = { version = "0.1.0", path = "../../../crates/dupes" }
tessera-insights = { version = "0.1.0", path = "../../../crates/insights" }
tessera-licensing = { version = "0.1.0", path = "../../../crates/licensing" }
tessera-scan = { path = "../../../crates/scan" }
tessera-treemap = { path = "../../../crates/treemap" }
